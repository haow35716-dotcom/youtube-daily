<h1>youtube-daily</h1>
<p>youtube-daily 是一个在用户自己的电脑上运行的小工具，用于读取用户自己的 YouTube 频道数据，例如观看次数、观看时长和订阅变化。</p>
<p>它通过 YouTube 官方 API 以只读方式访问数据，不修改频道的任何内容。</p>
<p>所有数据处理均在用户本地完成，授权信息只保存在用户自己的电脑上，不会发送给任何第三方。</p>
<p><a href="privacy.html">隐私政策</a></p>
<p>本页面仅用于说明应用用途，不收集任何访问者信息。</p>
